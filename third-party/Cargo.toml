# Third-party crates for the buck2 build, turned into third-party/BUCK by
# reindeer (`reindeer --third-party-dir third-party buckify`). Keep these in
# step with [workspace.dependencies] in the root Cargo.toml.
[package]
name = "simmer-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "/dev/null"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
notify = "8"
libc = "0.2"

[workspace]
