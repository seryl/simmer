[workspace]
resolver = "2"
members = ["crates/simmer-core", "crates/simmer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Josh Toft <joshtoft@gmail.com>"]
repository = "https://github.com/seryl/simmer"
homepage = "https://github.com/seryl/simmer"
keywords = ["nix", "devshell", "direnv", "environment", "shell"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
notify = "8"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
