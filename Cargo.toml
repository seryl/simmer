[workspace]
resolver = "2"
members = ["crates/simmer-core", "crates/simmer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
notify = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
